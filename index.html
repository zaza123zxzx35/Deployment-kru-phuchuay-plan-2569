<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนติว ครูผู้ช่วย รอบทั่วไป 69 — วิชาเอกอังกฤษ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #f7f5f0;
  --surface:     #ffffff;
  --surface-2:   #f3f1ec;
  --surface-3:   #ede9e2;
  --border:      #e2ddd5;
  --border-soft: #ede9e2;
  --ink:         #2d2a26;
  --ink-mid:     #5a5650;
  --ink-soft:    #9b968d;
  --ink-faint:   #c8c3bb;
  --sage:        #7a9e87;
  --sage-light:  #c8dece;
  --sage-faint:  #eaf2ec;
  --sage-deep:   #557a63;
  --blush:       #c29a8f;
  --blush-light: #e8cfc8;
  --blush-faint: #f7efed;
  --amber:       #b8934a;
  --amber-light: #e8d8b0;
  --amber-faint: #faf4e4;
  --lavender:    #8b7fad;
  --lavender-faint: #f0edf7;
  --sky:         #6d9ab8;
  --sky-faint:   #eaf2f8;
  --done-bg:     #eaf4ee;
  --done-text:   #4a7a58;
  --done-border: #b8d8c0;
  --r: 12px;
  --r-sm: 8px;
  --r-xs: 6px;
  --shadow-xs:  0 1px 3px rgba(0,0,0,0.04);
  --shadow-sm:  0 2px 8px rgba(0,0,0,0.06);
  --shadow-md:  0 4px 16px rgba(0,0,0,0.08);
  --font-body: 'IBM Plex Sans Thai', 'Sarabun', sans-serif;
  --font-serif: 'Noto Serif Thai', serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.app-shell { max-width: 560px; margin: 0 auto; padding: 0 0 80px; }
.top-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 14px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 12px;
}
.top-bar-title { flex: 1; font-family: var(--font-serif); font-size: 0.92rem; font-weight: 600; color: var(--ink); }
.top-bar-sub { font-size: 0.72rem; color: var(--ink-soft); font-weight: 400; margin-top: 1px; }
.top-bar-day-chip {
  background: var(--sage-faint); color: var(--sage-deep);
  border: 1px solid var(--sage-light); border-radius: 20px;
  padding: 4px 12px; font-size: 0.72rem; font-weight: 600;
  white-space: nowrap; font-family: var(--font-mono);
}
.progress-strip {
  background: var(--surface); padding: 10px 20px;
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; gap: 10px;
}
.progress-bar-track { flex: 1; height: 5px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--sage), var(--sage-deep)); border-radius: 99px; transition: width .6s; width: 0%; }
.progress-label { font-size: 0.7rem; color: var(--ink-soft); white-space: nowrap; font-family: var(--font-mono); min-width: 100px; text-align: right; }
.nav-tabs {
  display: flex; background: var(--surface);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
  position: sticky; top: 63px; z-index: 99;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  flex: none; padding: 10px 18px; font-size: 0.78rem; font-weight: 500;
  color: var(--ink-mid); border-bottom: 2px solid transparent;
  cursor: pointer; white-space: nowrap; transition: all .15s;
  background: none; border-top: none; border-left: none; border-right: none;
  font-family: var(--font-body);
}
.nav-tab:hover { color: var(--sage); background: var(--sage-faint); }
.nav-tab.active { color: var(--sage-deep); border-bottom-color: var(--sage); font-weight: 600; }
.view { display: none; padding: 20px 16px; }
.view.active { display: block; }
.countdown-widget {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 18px 20px; margin-bottom: 16px;
  box-shadow: var(--shadow-xs); display: flex; align-items: center; gap: 16px;
}
.countdown-nums { display: flex; gap: 8px; }
.cd-unit { text-align: center; background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px; min-width: 48px; }
.cd-num { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 500; color: var(--blush); line-height: 1; }
.cd-lbl { font-size: 0.62rem; color: var(--ink-soft); margin-top: 3px; }
.countdown-text { flex: 1; font-size: 0.78rem; color: var(--ink-mid); line-height: 1.5; }
.countdown-text strong { color: var(--ink); font-weight: 600; }
.today-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); box-shadow: var(--shadow-sm); overflow: hidden;
}
.today-header { padding: 16px 20px 14px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: baseline; gap: 8px; }
.today-title { font-family: var(--font-serif); font-size: 1.0rem; font-weight: 600; color: var(--ink); flex: 1; }
.today-date-chip { font-size: 0.7rem; color: var(--ink-soft); font-family: var(--font-mono); }
.today-progress-row { padding: 10px 20px; background: var(--surface-2); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-soft); }
.today-progress-text { font-size: 0.72rem; color: var(--ink-mid); }
.today-progress-track { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.today-progress-fill { height: 100%; background: var(--sage); border-radius: 99px; transition: width .4s; }
.tasks-list { padding: 8px 0; }
.task-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 13px 20px; border-bottom: 1px solid var(--border-soft);
  cursor: pointer; transition: background .12s; user-select: none;
}
.task-item:last-child { border-bottom: none; }
.task-item:hover { background: var(--surface-2); }
.task-item.done { background: var(--done-bg); }
.task-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 1.5px solid var(--border); display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
  margin-top: 1px; transition: all .2s; background: var(--surface);
}
.task-item.done .task-check { background: var(--sage); border-color: var(--sage); color: white; font-size: 0.7rem; }
.task-body { flex: 1; min-width: 0; }
.task-text { font-size: 0.87rem; color: var(--ink); line-height: 1.45; }
.task-item.done .task-text { color: var(--done-text); text-decoration: line-through; text-decoration-color: var(--sage-light); }
.task-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.task-link {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 10px; border-radius: 20px; font-size: 0.68rem; font-weight: 500;
  text-decoration: none; background: var(--sky-faint); color: var(--sky);
  border: 1px solid #c5ddef; transition: all .15s; white-space: nowrap;
}
.task-link:hover { background: #daeaf5; }
.pri-chip { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 0.63rem; font-weight: 500; white-space: nowrap; }
.pri-high { background: var(--blush-faint); color: var(--blush); border: 1px solid var(--blush-light); }
.pri-med  { background: var(--amber-faint); color: var(--amber); border: 1px solid var(--amber-light); }
.pri-low  { background: var(--sage-faint);  color: var(--sage);  border: 1px solid var(--sage-light);  }
.today-actions { padding: 14px 20px; border-top: 1px solid var(--border-soft); display: flex; gap: 8px; flex-wrap: wrap; }
.btn-action { flex: 1; min-width: 120px; padding: 9px 14px; border-radius: var(--r-sm); font-size: 0.78rem; font-weight: 500; cursor: pointer; border: 1px solid; font-family: var(--font-body); transition: all .15s; text-align: center; }
.btn-primary { background: var(--sage); color: white; border-color: var(--sage); }
.btn-primary:hover { background: var(--sage-deep); border-color: var(--sage-deep); }
.btn-ghost { background: var(--surface); color: var(--ink-mid); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: var(--surface); color: var(--blush); border-color: var(--blush-light); }
.btn-danger:hover { background: var(--blush-faint); }
.all-done-banner { padding: 24px 20px; text-align: center; }
.all-done-icon { font-size: 2.5rem; margin-bottom: 10px; }
.all-done-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 600; color: var(--sage-deep); margin-bottom: 6px; }
.all-done-sub { font-size: 0.82rem; color: var(--ink-soft); }
.section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow-xs); }
.section-toggle { width: 100%; background: none; border: none; padding: 14px 18px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-family: var(--font-body); text-align: left; }
.section-toggle:hover { background: var(--surface-2); }
.section-icon { font-size: 1rem; }
.section-label { flex: 1; font-size: 0.86rem; font-weight: 500; color: var(--ink); }
.section-badge { font-size: 0.68rem; padding: 2px 8px; border-radius: 20px; background: var(--surface-3); color: var(--ink-soft); font-family: var(--font-mono); }
.section-chevron { color: var(--ink-faint); font-size: 0.7rem; transition: transform .2s; }
.section-toggle.open .section-chevron { transform: rotate(180deg); }
.section-body { display: none; padding: 4px 18px 16px; border-top: 1px solid var(--border-soft); }
.section-body.open { display: block; }
.stat-strip { display: flex; gap: 8px; margin-bottom: 16px; }
.stat-box { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 10px; text-align: center; box-shadow: var(--shadow-xs); }
.stat-num { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 500; color: var(--sage); line-height: 1; }
.stat-lbl { font-size: 0.65rem; color: var(--ink-soft); margin-top: 4px; }
.dot-map { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; background: var(--surface-2); border-radius: var(--r-sm); margin: 10px 0; }
.dot { width: 10px; height: 10px; border-radius: 3px; cursor: pointer; transition: opacity .15s, transform .1s; }
.dot:hover { opacity: 0.7; transform: scale(1.3); }
.hist-selector { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); font-family: var(--font-body); font-size: 0.84rem; color: var(--ink); background: var(--surface); outline: none; margin-bottom: 14px; cursor: pointer; }
.hist-nav { display: flex; gap: 6px; margin-bottom: 14px; }
.btn-nav { padding: 7px 16px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--ink-mid); font-family: var(--font-body); font-size: 0.78rem; cursor: pointer; }
.btn-nav:hover { background: var(--surface-2); }
.motivator-card { background: linear-gradient(135deg, var(--sage-faint), var(--blush-faint)); border: 1px solid var(--sage-light); border-radius: var(--r); padding: 14px 18px; margin-bottom: 16px; font-size: 0.82rem; color: var(--ink-mid); line-height: 1.6; }
.motivator-main { font-weight: 500; color: var(--ink); margin-bottom: 4px; }
.motivator-tip { font-size: 0.73rem; color: var(--sage-deep); }
.info-box { padding: 10px 14px; border-radius: var(--r-sm); font-size: 0.8rem; margin: 8px 0; line-height: 1.5; }
.info-sage { background: var(--sage-faint); border-left: 3px solid var(--sage-light); color: var(--sage-deep); }
.info-amber { background: var(--amber-faint); border-left: 3px solid var(--amber-light); color: #7a5e20; }
.info-blush { background: var(--blush-faint); border-left: 3px solid var(--blush-light); color: #7a4a42; }
.note-area { width: 100%; min-height: 80px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); font-family: var(--font-body); font-size: 0.82rem; color: var(--ink); background: var(--surface-2); resize: vertical; outline: none; }
.note-area:focus { border-color: var(--sage-light); }
@media (max-width: 400px) {
  .top-bar-title { font-size: 0.84rem; }
  .nav-tab { padding: 9px 13px; font-size: 0.73rem; }
  .task-item { padding: 11px 16px; }
  .view { padding: 16px 12px; }
}
</style>
</head>
<body>
<div class="app-shell">

  <div class="top-bar">
    <div>
      <div class="top-bar-title">แผนติว ครูผู้ช่วย รอบทั่วไป 69</div>
      <div class="top-bar-sub">วิชาเอกภาษาอังกฤษ · สอบ 14-15 พ.ย. 69</div>
    </div>
    <div class="top-bar-day-chip" id="topbar-day-chip">วันที่ —</div>
  </div>

  <div class="progress-strip">
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-nums">0 / 34 วัน</div>
  </div>

  <div class="nav-tabs" id="nav-tabs">
    <button class="nav-tab active" onclick="showView('today',this)">วันนี้</button>
    <button class="nav-tab" onclick="showView('overview',this)">ภาพรวม</button>
    <button class="nav-tab" onclick="showView('history',this)">ย้อนดูวัน</button>
    <button class="nav-tab" onclick="showView('plan',this)">แผนโดยภาพรวม</button>
    <button class="nav-tab" onclick="showView('resources',this)">คลังเรียน</button>
  </div>

  <!-- ═══ TODAY ═══ -->
  <div class="view active" id="view-today">
    <div class="motivator-card">
      <div class="motivator-main" id="mtxt">กำลังโหลด...</div>
      <div class="motivator-tip" id="mtip"></div>
    </div>
    <div class="countdown-widget">
      <div class="countdown-nums" id="countdown-nums">
        <div class="cd-unit"><div class="cd-num" id="cd-d">—</div><div class="cd-lbl">วัน</div></div>
        <div class="cd-unit"><div class="cd-num" id="cd-h">—</div><div class="cd-lbl">ชั่วโมง</div></div>
        <div class="cd-unit"><div class="cd-num" id="cd-m">—</div><div class="cd-lbl">นาที</div></div>
      </div>
      <div class="countdown-text" id="countdown-text">กำลังนับถอยหลัง...</div>
    </div>
    <div class="today-card" id="today-card">
      <div style="padding:24px;text-align:center;color:var(--ink-faint);font-size:0.82rem;">⏳ กำลังโหลด...</div>
    </div>
    <div class="section-card" style="margin-top:12px;">
      <button class="section-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
        <span class="section-icon">✏️</span>
        <span class="section-label">บันทึกของวันนี้</span>
        <span class="section-chevron">▼</span>
      </button>
      <div class="section-body">
        <textarea class="note-area" id="daily-note-ta" placeholder="จด Weak Point หรือสิ่งที่เรียนรู้วันนี้..." onblur="saveNote()"></textarea>
      </div>
    </div>
  </div>

  <!-- ═══ OVERVIEW ═══ -->
  <div class="view" id="view-overview">
    <div class="stat-strip" id="ov-stats">
      <div class="stat-box"><div class="stat-num" id="ov-done">0</div><div class="stat-lbl">วันเสร็จ</div></div>
      <div class="stat-box"><div class="stat-num" id="ov-streak" style="color:var(--blush)">0</div><div class="stat-lbl">🔥 Streak</div></div>
      <div class="stat-box"><div class="stat-num" id="ov-pct" style="color:var(--amber)">0%</div><div class="stat-lbl">ความคืบหน้า</div></div>
    </div>
    <div class="section-card">
      <div style="padding:14px 16px 6px;">
        <div style="font-size:0.72rem;color:var(--ink-soft);margin-bottom:8px;">แผนที่ 34 วัน <span style="color:var(--sage)">■ ครบ</span> <span style="color:var(--amber)">■ บางส่วน</span> <span style="color:var(--ink-faint)">■ ยัง</span></div>
        <div class="dot-map" id="ov-dotmap"></div>
      </div>
    </div>
    <div id="ov-incomplete"></div>
  </div>

  <!-- ═══ HISTORY ═══ -->
  <div class="view" id="view-history">
    <div style="margin-bottom:4px;font-size:0.8rem;color:var(--ink-soft);">เลือกวันที่ต้องการดูหรือแก้ไข</div>
    <select class="hist-selector" id="hist-sel" onchange="histRender()"></select>
    <div class="hist-nav">
      <button class="btn-nav" onclick="histNav(-1)">◀ วันก่อน</button>
      <button class="btn-nav" onclick="histNav(1)">วันถัดไป ▶</button>
    </div>
    <div id="hist-day"></div>
  </div>

  <!-- ═══ PLAN OVERVIEW ═══ -->
  <div class="view" id="view-plan">
    <div class="section-card">
      <button class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
        <span class="section-icon">🗺️</span>
        <span class="section-label">แผนการเตรียมตัว 5 Phase</span>
        <span class="section-chevron">▼</span>
      </button>
      <div class="section-body open">
        <div id="plan-phases"></div>
      </div>
    </div>
    <div class="section-card">
      <button class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
        <span class="section-icon">📊</span>
        <span class="section-label">โครงสร้างคะแนนสอบ</span>
        <span class="section-chevron">▼</span>
      </button>
      <div class="section-body open">
        <div id="score-structure"></div>
      </div>
    </div>
  </div>

  <!-- ═══ RESOURCES ═══ -->
  <div class="view" id="view-resources">
    <div class="section-card">
      <button class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
        <span class="section-icon">📚</span>
        <span class="section-label">คอร์สที่ติดตาม</span>
        <span class="section-chevron">▼</span>
      </button>
      <div class="section-body open" id="courses-content"></div>    </div>
    <div class="section-card">
      <button class="section-toggle open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
        <span class="section-icon">🔗</span>
        <span class="section-label">ลิงก์สำคัญ</span>
        <span class="section-chevron">▼</span>
      </button>
      <div class="section-body open" id="links-content"></div>
    </div>
  </div>

  <script>
    const START = new Date(2026, 9, 12); // 12 ต.ค. 2569 — วันเริ่มต้นแผน
    const EXAM1 = new Date(2026, 10, 13); // 13 พ.ย. 2569 — สอบภาค ก
    const EXAM2 = new Date(2026, 10, 14); // 14 พ.ย. 2569 — สอบภาค ข
    const motivators = [
      {m:'อยากบรรจุ ต้องผ่าน!', t:'ติวทุกวัน สู้ๆ ครูเก้า'},
      {m:'1 วัน = 1 คะแนน', t:'อย่าขาดวัน ยิ่งติว ยิ่งได้'},
      {m:'ฝึกทำข้อสอบเป็นประจำ', t:'ทำ i-test ทุกวัน เช็คจุดผิด'},
      {m:'จดจุดผิด แล้วทำซ้ำ', t:'จุดผิดคือจุดที่จะได้คะแนน'},
      {m:'Grammar + Method คือเพชร', t:'อังกฤษ 100 คะแนน ต้องได้มา'},
      {m:'กฎหมายครูอ่านจนใจ', t:'พ.ร.บ.ต่างๆ ต้องผ่านเข้าหัว'},
      {m:'พักผ่อนสม่ำเสมอ', t:'สมองพักแล้วจะจำได้ดีขึ้น'},
      {m:'เชื่อในตัวเอง', t:'ครูเก้าทำได้ สู้ๆ!'},
      {m:'วันละนิด เดือนละมาก', t:'สม่ำเสมอคือกุญแจสู่ความสำเร็จ'},
      {m:'โอกาสมาครั้งเดียว', t:'รอบนี้ต้องบรรจุเลย!'}
    ];
    const dailyPlan = [
  // Day 1 — 12 ต.ค. (จันทร์)

function loadState() {

// ─── DATE HELPERS ───
function dateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getDayIndex(d) {
  const start = new Date(START.getFullYear(), START.getMonth(), START.getDate());
  const cur = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.floor((cur - start) / 86400000);
}
function getDateByIndex(i) {
  const d = new Date(START);
  d.setDate(d.getDate()+i);
  return d;
}
function fmtDateTh(d) {
  const names = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  return 'วัน'+names[d.getDay()]+' '+d.getDate()+' '+['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][d.getMonth()]+' '+(d.getFullYear()+543);
}

// ─── COUNTDOWN ───
function updateCountdown() {
  const now = new Date();
  const target = EXAM1;
  const diff = target - now;
  if (diff <= 0) {
    document.getElementById('countdown-text').innerHTML = '<strong>สอบแล้ววันนี้! สู้ๆ!</strong>';
    document.getElementById('cd-d').textContent = '0';
    document.getElementById('cd-h').textContent = '0';
    document.getElementById('cd-m').textContent = '0';
    return;
  }
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  document.getElementById('cd-d').textContent = d;
  document.getElementById('cd-h').textContent = h;
  document.getElementById('cd-m').textContent = m;
  document.getElementById('countdown-text').innerHTML = 'ถึงสอบ <strong>ภาค ก</strong> 14 พ.ย. 69<br>อีก <strong>'+d+' วัน</strong> ต้องเร่งติวให้ครบทุกจุด';
}

// ─── RENDER TODAY ───
function renderToday() {
  const now = new Date();
  const idx = getDayIndex(now);
  const today = getDateByIndex(idx);
  document.getElementById('topbar-day-chip').textContent = 'วันที่ '+(idx+1)+'/'+TOTAL_DAYS;

  if (idx < 0 || idx >= TOTAL_DAYS) {
    document.getElementById('today-card').innerHTML = '<div class="all-done-banner"><div class="all-done-icon">🎯</div><div class="all-done-title">หมดแผนแล้ว!</div><div class="all-done-sub">ไปโฟกัสทำข้อสอบและทบทวนจุดอ่อนนะครับ</div></div>';
    return;
  }

  const tasks = dailyPlan[idx] || [];
  const dayKey = dateStr(today);
  const dayState = state.days[dayKey] || {};

  let doneCount = 0;
  tasks.forEach((t,i) => { if (dayState[i]) doneCount++; });
  const pct = tasks.length ? Math.round(doneCount/tasks.length*100) : 0;

  let html = '<div class="today-header"><div class="today-title">วันนี้ติวอะไร?</div><div class="today-date-chip">'+fmtDateTh(today)+'</div></div>';
  html += '<div class="today-progress-row"><span class="today-progress-text">'+doneCount+'/'+tasks.length+' งาน</span><div class="today-progress-track"><div class="today-progress-fill" style="width:'+pct+'%"></div></div></div>';

  if (doneCount === tasks.length && tasks.length > 0) {
    html += '<div class="all-done-banner"><div class="all-done-icon">✅</div><div class="all-done-title">เสร็จทั้งหมดแล้ว!</div><div class="all-done-sub">เก่งมาก พักผ่อนหรือทบทวนเพิ่มเติมได้</div></div>';
  } else {
    html += '<div class="tasks-list">';
    tasks.forEach((t,i) => {
      const done = dayState[i] ? 'done' : '';
      const priCls = 'pri-'+(t.pri||'low');
      const priTxt = t.pri==='high'?'สำคัญ':t.pri==='med'?'ปานกลาง':'น้อย';
      html += '<div class="task-item '+done+'" onclick="if(!event.target.closest(\'a\'))toggleTask('+idx+','+i+')">';
      html += '<div class="task-check">'+(dayState[i]?'✓':'')+'</div>';
      html += '<div class="task-body"><div class="task-text">'+t.text+'</div>';
      html += '<div class="task-meta"><span class="pri-chip '+priCls+'">'+priTxt+'</span>';
      if (t.link) html += '<a class="task-link" href="'+t.link+'" target="_blank" rel="noopener" onclick="event.stopPropagation();window.open(this.href,\'_blank\');return false;">📂 เปิดลิงก์</a>';
      html += '</div></div></div>';
    });
    html += '</div>';
  }

  html += '<div class="today-actions">';
  html += '<button class="btn-action btn-primary" onclick="markAllToday(true)">ทำครบทั้งหมด</button>';
  html += '<button class="btn-action btn-ghost" onclick="markAllToday(false)">รีเซ็ตวันนี้</button>';
  html += '</div>';

  document.getElementById('today-card').innerHTML = html;

  // note
  if (state.notes[dayKey]) {
    document.getElementById('daily-note-ta').value = state.notes[dayKey];
  } else {
    document.getElementById('daily-note-ta').value = '';
  }
}

function toggleTask(dayIdx, taskIdx) {
  const d = getDateByIndex(dayIdx);
  const key = dateStr(d);
  if (!state.days[key]) state.days[key] = {};
  state.days[key][taskIdx] = !state.days[key][taskIdx];
  saveState(state);
  if (dayIdx === getDayIndex(new Date())) renderToday();
  else if (document.getElementById('view-history').classList.contains('active')) histRender();
  updateProgress();
}

function markAllToday(val) {
  const idx = getDayIndex(new Date());
  const d = getDateByIndex(idx);
  const key = dateStr(d);
  const tasks = dailyPlan[idx] || [];
  if (!state.days[key]) state.days[key] = {};
  tasks.forEach((_,i) => { state.days[key][i] = val; });
  saveState(state);
  renderToday();
  updateProgress();
}

function saveNote() {
  const idx = getDayIndex(new Date());
  const key = dateStr(getDateByIndex(idx));
  state.notes[key] = document.getElementById('daily-note-ta').value;
  saveState(state);
}

// ─── PROGRESS ───
function updateProgress() {
  let completed = 0;
  for (let i = 0; i < TOTAL_DAYS; i++) {
    const d = getDateByIndex(i);
    const key = dateStr(d);
    const ds = state.days[key] || {};
    const tasks = dailyPlan[i] || [];
    let done = 0;
    tasks.forEach((_,j) => { if (ds[j]) done++; });
    if (tasks.length > 0 && done === tasks.length) completed++;
  }
  const pct = Math.round(completed/TOTAL_DAYS*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-nums').textContent = completed+' / '+TOTAL_DAYS+' วัน';
}

// ─── OVERVIEW ───
function renderOverview() {
  let completed = 0, streak = 0, maxStreak = 0, curStreak = 0;
  for (let i = 0; i < TOTAL_DAYS; i++) {
    const d = getDateByIndex(i);
    const key = dateStr(d);
    const ds = state.days[key] || {};
    const tasks = dailyPlan[i] || [];
    let done = 0;
    tasks.forEach((_,j) => { if (ds[j]) done++; });
    const allDone = tasks.length > 0 && done === tasks.length;
    if (allDone) { completed++; curStreak++; maxStreak = Math.max(maxStreak, curStreak); }
    else curStreak = 0;
  }
  // current streak (from today backward)
  const todayIdx = getDayIndex(new Date());
  for (let i = todayIdx; i >= 0; i--) {
    const d = getDateByIndex(i);
    const key = dateStr(d);
    const ds = state.days[key] || {};
    const tasks = dailyPlan[i] || [];
    let done = 0;
    tasks.forEach((_,j) => { if (ds[j]) done++; });
    if (tasks.length > 0 && done === tasks.length) streak++;
    else break;
  }
  const pct = Math.round(completed/TOTAL_DAYS*100);
  document.getElementById('ov-done').textContent = completed;
  document.getElementById('ov-streak').textContent = streak;
  document.getElementById('ov-pct').textContent = pct+'%';

  let dotHtml = '';
  for (let i = 0; i < TOTAL_DAYS; i++) {
    const d = getDateByIndex(i);
    const key = dateStr(d);
    const ds = state.days[key] || {};
    const tasks = dailyPlan[i] || [];
    let done = 0;
    tasks.forEach((_,j) => { if (ds[j]) done++; });
    let color = 'var(--ink-faint)';
    if (tasks.length > 0) {
      if (done === tasks.length) color = 'var(--sage)';
      else if (done > 0) color = 'var(--amber)';
    }
    dotHtml += '<div class="dot" style="background:'+color+'" title="วัน '+(i+1)+' ('+d.getDate()+'/'+(d.getMonth()+1)+'): '+done+'/'+tasks.length+'" onclick="goDay('+i+')"></div>';
  }
  document.getElementById('ov-dotmap').innerHTML = dotHtml;

  // incomplete upcoming
  let incHtml = '<div class="section-card"><button class="section-toggle open" onclick="this.classList.toggle(\'open\');this.nextElementSibling.classList.toggle(\'open\')"><span class="section-icon">📋</span><span class="section-label">งานที่ยังไม่เสร็จ (วันถัดไป)</span><span class="section-chevron">▼</span></button><div class="section-body open">';
  const todayI = getDayIndex(new Date());
  let found = 0;
  for (let i = todayI; i < TOTAL_DAYS && found < 5; i++) {
    const d = getDateByIndex(i);
    const key = dateStr(d);
    const ds = state.days[key] || {};
    const tasks = dailyPlan[i] || [];
    let done = 0;
    tasks.forEach((_,j) => { if (ds[j]) done++; });
    if (done < tasks.length) {
      incHtml += '<div style="padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:0.82rem;"><strong style="color:var(--sage-deep)">วัน '+(i+1)+' ('+fmtDateTh(d).split(' ')[1]+')</strong> — '+done+'/'+tasks.length+' เสร็จ</div>';
      found++;
    }
  }
  if (found === 0) incHtml += '<div style="font-size:0.82rem;color:var(--ink-soft);padding:10px 0;">ไม่มีงานค้าง — เก่งมาก!</div>';
  incHtml += '</div></div>';
  document.getElementById('ov-incomplete').innerHTML = incHtml;
}

function goDay(i) {
  showView('history', document.querySelector('.nav-tab:nth-child(3)'));
  document.getElementById('hist-sel').value = i;
  histRender();
}

// ─── HISTORY ───
function buildHistSel() {
  const sel = document.getElementById('hist-sel');
  sel.innerHTML = '';
  for (let i = 0; i < TOTAL_DAYS; i++) {
    const d = getDateByIndex(i);
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = 'วัน '+(i+1)+' — '+fmtDateTh(d);
    sel.appendChild(opt);
  }
  const todayIdx = getDayIndex(new Date());
  if (todayIdx >= 0 && todayIdx < TOTAL_DAYS) sel.value = todayIdx;
  histRender();
}
function histNav(dir) {
  const sel = document.getElementById('hist-sel');
  let v = parseInt(sel.value) + dir;
  if (v < 0) v = 0; if (v >= TOTAL_DAYS) v = TOTAL_DAYS-1;
  sel.value = v;
  histRender();
}
function histRender() {
  const idx = parseInt(document.getElementById('hist-sel').value);
  const d = getDateByIndex(idx);
  const key = dateStr(d);
  const ds = state.days[key] || {};
  const tasks = dailyPlan[idx] || [];
  let done = 0;
  tasks.forEach((_,j) => { if (ds[j]) done++; });
  const pct = tasks.length ? Math.round(done/tasks.length*100) : 0;

  let html = '<div class="today-card">';
  html += '<div class="today-header"><div class="today-title">วันที่ '+(idx+1)+'/'+TOTAL_DAYS+'</div><div class="today-date-chip">'+fmtDateTh(d)+'</div></div>';
  html += '<div class="today-progress-row"><span class="today-progress-text">'+done+'/'+tasks.length+' งาน ('+pct+'%)</span><div class="today-progress-track"><div class="today-progress-fill" style="width:'+pct+'%"></div></div></div>';
  html += '<div class="tasks-list">';
  tasks.forEach((t,i) => {
    const doneCls = ds[i] ? 'done' : '';
    const priTxt = t.pri==='high'?'สำคัญ':t.pri==='med'?'ปานกลาง':'น้อย';
    html += '<div class="task-item '+doneCls+'" onclick="if(!event.target.closest(\'a\'))toggleTask('+idx+','+i+')">';
    html += '<div class="task-check">'+(ds[i]?'✓':'')+'</div>';
    html += '<div class="task-body"><div class="task-text">'+t.text+'</div><div class="task-meta"><span class="pri-chip pri-'+(t.pri||'low')+'">'+priTxt+'</span>';
    if (t.link) html += '<a class="task-link" href="'+t.link+'" target="_blank" rel="noopener" onclick="event.stopPropagation();window.open(this.href,\'_blank\');return false;">📂 เปิดลิงก์</a>';
    html += '</div></div></div>';
  });
  html += '</div></div>';
  document.getElementById('hist-day').innerHTML = html;
}

// ─── PLAN VIEW ───
function renderPlan() {
  let ph = '';
  phases.forEach((p,i) => {
    ph += '<div style="padding:10px 0;border-bottom:1px solid var(--border-soft);"><div style="font-weight:600;font-size:0.85rem;color:var(--ink);margin-bottom:3px;">'+(i+1)+'. '+p.name+'</div><div style="font-size:0.75rem;color:var(--sage-deep);font-family:var(--font-mono);margin-bottom:3px;">'+p.range+'</div><div style="font-size:0.78rem;color:var(--ink-mid);">'+p.desc+'</div></div>';
  });
  document.getElementById('plan-phases').innerHTML = ph;

  let sc = '<div style="font-size:0.82rem;line-height:1.8;">';
  sc += '<div style="font-weight:600;margin-bottom:8px;color:var(--ink);">14 พ.ย. 2569 — สอบภาค ก (200 คะแนน)</div>';
  sc += '<div style="padding-left:12px;color:var(--ink-mid);">• ความสามารถในการคิดวิเคราะห์ — 100 คะแนน</div>';
  sc += '<div style="padding-left:12px;color:var(--ink-mid);">• ทักษะภาษาอังกฤษ — 50 คะแนน</div>';
  sc += '<div style="padding-left:12px;color:var(--ink-mid);">• ความรู้ทั่วไป + ลักษณะข้าราชการ — 50 คะแนน</div>';
  sc += '<div style="font-weight:600;margin:12px 0 8px;color:var(--ink);">15 พ.ย. 2569 — สอบภาค ข (100 คะแนน)</div>';
  sc += '<div style="padding-left:12px;color:var(--ink-mid);">• วิชาการศึกษา — 50 คะแนน</div>';
  sc += '<div style="padding-left:12px;color:var(--ink-mid);">• วิชาเอกภาษาอังกฤษ — 50 คะแนน</div>';
  sc += '<div style="margin-top:14px;padding:10px 12px;background:var(--sage-faint);border-radius:var(--r-sm);font-size:0.78rem;color:var(--sage-deep);">💡 ยุทธศาสตร์: ภาค ก คะแนนเยอะสุด ให้โฟกัส 70% ของเวลา วิชาเอกอังกฤษคือจุดแข็ง ต้องได้สูงสุด</div>';
  sc += '</div>';
  document.getElementById('score-structure').innerHTML = sc;
}

// ─── RESOURCES ───
function renderResources() {
  let ch = '';
  courses.forEach(c => {
    ch += '<div style="padding:10px 0;border-bottom:1px solid var(--border-soft);"><div style="font-weight:600;font-size:0.85rem;color:var(--ink);margin-bottom:4px;">'+c.name+'</div><div style="font-size:0.78rem;color:var(--ink-mid);line-height:1.5;">'+c.desc+'</div></div>';
  });
  document.getElementById('courses-content').innerHTML = ch;

  let lk = '';
  importantLinks.forEach(l => {
    lk += '<div style="padding:8px 0;border-bottom:1px solid var(--border-soft);"><a href="'+l.url+'" target="_blank" style="color:var(--sky);font-size:0.82rem;text-decoration:none;">🔗 '+l.name+'</a></div>';
  });
  document.getElementById('links-content').innerHTML = lk;
}

// ─── INIT ───
function init() {
  updateCountdown();
  updateMotivator();
  renderToday();
  updateProgress();
  renderPlan();
  renderResources();
  setInterval(updateCountdown, 60000);
}
init();
</script>
</body>
</html>
